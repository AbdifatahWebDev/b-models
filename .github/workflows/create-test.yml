name: Create and Swap quality test

# Candidates for Brekwol Upscale's planned Create and Swap screens, run by their own code on the
# CPU in fp32 (the phone runs fp32 activations too), with times and peak memory:
#   Create: SANA-Sprint 0.6B and 1.6B (1024 px, 2 steps) and FLUX.2 klein 4B (512 px, 4 steps).
#   Swap:   FaceFusion's hyperswap_1a/1c and inswapper (+ GFPGAN), FASHN VTON v1.5 try-on, and
#           FLUX.2 klein edits (background, day/night, try-on, face swap) for comparison.
# The people in the test are generated by SANA-Sprint 1.6B in the first job (tools/create/cases.py),
# so no photos of real people are used. Posts sheets and the full-size outputs to release
# create-test. Test only, nothing here is used by the app. Started by hand only.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FACEFUSION_COMMIT: decc6c9d8f8e014878624452c6e8fe208726b4ec
  FASHN_COMMIT: 7c0f10af3f91ad4048fe9729c470a13ef905d25a
  TORCH: torch==2.15.0 torchvision
  PY_PACKAGES: diffusers==0.42.1 transformers==5.22.2 accelerate==1.15.0 safetensors sentencepiece protobuf pillow
  HF_HOME: /mnt/hf

jobs:
  sana:
    name: SANA-Sprint ${{ matrix.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        size: ["0.6b", "1.6b"]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      REPO: ${{ matrix.size == '0.6b' && 'Efficient-Large-Model/Sana_Sprint_0.6B_1024px_diffusers' || 'Efficient-Large-Model/Sana_Sprint_1.6B_1024px_diffusers' }}
      # The larger model also makes the people and garments the swap and try-on jobs use.
      INPUTS: ${{ matrix.size == '1.6b' && '--inputs' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: bash bm/tools/create/runner-setup.sh 16
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU)
        run: |
          pip install $TORCH --index-url https://download.pytorch.org/whl/cpu
          pip install $PY_PACKAGES
      - name: SANA-Sprint ${{ matrix.size }}
        run: |
          set -o pipefail
          mkdir -p o
          echo "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs), $(nproc) threads, fp32" > o/cpu.txt
          cd bm/tools/create
          /usr/bin/time -v -o ../../../o/time.txt python3 sana.py "$REPO" ../../../o $INPUTS 2>&1 | tee ../../../o/log.txt
      - name: Keep outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sana-${{ matrix.size }}
          path: o

  klein:
    name: FLUX.2 klein 4B
    needs: sana
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap (16 GB of weights in fp32 per part on a 16 GB runner)
        run: bash bm/tools/create/runner-setup.sh 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU)
        run: |
          pip install $TORCH --index-url https://download.pytorch.org/whl/cpu
          pip install $PY_PACKAGES
      - name: Inputs
        uses: actions/download-artifact@v4
        with:
          name: sana-1.6b
          path: sana16
      - name: FLUX.2 klein 4B (512 px)
        timeout-minutes: 300
        run: |
          set -o pipefail
          mkdir -p o
          echo "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs), $(nproc) threads, fp32" > o/cpu.txt
          cd bm/tools/create
          /usr/bin/time -v -o ../../../o/time.txt python3 klein.py black-forest-labs/FLUX.2-klein-4B ../../../o \
            ../../../sana16/inputs ../../../sana16 2>&1 | tee ../../../o/log.txt
      - name: Keep outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klein
          path: o

  swap:
    name: Face swap (FaceFusion)
    needs: sana
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FaceFusion (CPU)
        run: |
          sudo apt-get install -y -qq ffmpeg curl time
          git init -q ff
          git -C ff fetch -q --depth 1 https://github.com/facefusion/facefusion "$FACEFUSION_COMMIT"
          git -C ff checkout -q FETCH_HEAD
          pip install -r ff/requirements.txt
      - name: Inputs
        uses: actions/download-artifact@v4
        with:
          name: sana-1.6b
          path: sana16
      - name: Face swaps
        run: |
          set -o pipefail
          mkdir -p o
          echo "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs), $(nproc) threads" > o/cpu.txt
          /usr/bin/time -v -o o/time.txt python3 bm/tools/create/swap.py ff o sana16/inputs 2>&1 | tee o/log.txt
      - name: Keep outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swap
          path: o

  tryon:
    name: Try-on (FASHN VTON v1.5)
    needs: sana
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: bash bm/tools/create/runner-setup.sh 8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FASHN VTON (CPU)
        run: |
          pip install $TORCH --index-url https://download.pytorch.org/whl/cpu
          git init -q fashn
          git -C fashn fetch -q --depth 1 https://github.com/fashn-AI/fashn-vton-1.5 "$FASHN_COMMIT"
          git -C fashn checkout -q FETCH_HEAD
          pip install -e fashn
          pip uninstall -y onnxruntime-gpu
          pip install onnxruntime
          python3 fashn/scripts/download_weights.py --weights-dir weights
      - name: Inputs
        uses: actions/download-artifact@v4
        with:
          name: sana-1.6b
          path: sana16
      - name: Try-on
        run: |
          set -o pipefail
          mkdir -p o
          echo "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs), $(nproc) threads, fp32" > o/cpu.txt
          cd bm/tools/create
          /usr/bin/time -v -o ../../../o/time.txt python3 tryon.py ../../../weights ../../../o ../../../sana16/inputs \
            ../../../fashn 2>&1 | tee ../../../o/log.txt
      - name: Keep outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tryon
          path: o

  sheets:
    name: Sheets
    needs: [sana, klein, swap, tryon]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: create-test
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Outputs of the model jobs
        uses: actions/download-artifact@v4
        with:
          path: art
      - name: Sheets and summary
        run: |
          set -o pipefail
          pip install pillow
          mkdir -p results
          (cd bm/tools/create && python3 sheets.py ../../../art ../../../results) 2>&1 | tee results/log-sheets.txt
          for d in art/*/; do
            n=$(basename "$d")
            echo "== $n: $(cat "$d/cpu.txt" 2>/dev/null || echo 'no result')"
            grep -E "Elapsed \(wall|Maximum resident" "$d/time.txt" 2>/dev/null || echo "  did not finish"
            cat "$d/times.json" 2>/dev/null || true
            echo
            cp "$d/log.txt" "results/log-$n.txt" 2>/dev/null || true
          done 2>&1 | tee results/summary.txt
          # Every output at full size, for a closer look than the sheets give.
          (cd art && zip -q -r ../results/create-test-outputs.zip . -i '*.png')
          ls -la results
      - name: Publish
        if: always()
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --prerelease --title "Create and Swap quality test files" \
            --notes "SANA-Sprint 0.6B/1.6B, FLUX.2 klein 4B, FaceFusion swappers and FASHN VTON v1.5 on the CPU. Comparison files. Not used by the app."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" results/* --clobber
