name: Edit model (FLUX.2 klein 4B)

# Builds Brekwol Upscale's edit model from FLUX.2 klein 4B (Black Forest Labs, Apache-2.0) with
# tools/edit/klein_export.py; see tools/edit/PLAN.md. So far, each in its own job:
#   text   Qwen3-4B's first 27 layers in pieces of three, block-quantized by ncnn's ncnnllm2int,
#          int8 embedding rows, and a check of the pieces against PyTorch;
#   image  the transformer: a time piece, five double blocks and the twenty single blocks in
#          pieces of four, block-quantized, and a check of one call against PyTorch.
# Every job prints memory and disk use each minute. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      bits:
        description: Text encoder weight bits
        type: choice
        options: ["8", "6", "4"]
        default: "8"
      block:
        description: Quantization block size
        type: choice
        options: ["64", "32", "128"]
        default: "64"
      jobs:
        description: Which parts to build
        type: choice
        options: ["all", "text", "image", "check"]
        default: "all"
      artifacts_run:
        description: "For 'check' alone: the run id whose text and image artifacts to use"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  NCNN_TAG: "20261020"
  REPO: black-forest-labs/FLUX.2-klein-4B
  HF_HOME: /mnt/hf
  TMPDIR: /mnt/tmp
  DIST: /mnt/dist
  PYTHONUNBUFFERED: "1"
  # Leave a core for the runner itself.
  OMP_NUM_THREADS: "3"
  TORCH_INSTALL: torch==2.15.0 torchvision --index-url https://download.pytorch.org/whl/cpu
  PY_PACKAGES: diffusers==0.42.1 transformers==5.22.2 accelerate==1.15.0 safetensors sentencepiece protobuf pillow numpy ncnn==1.0.20261020 pnnx==20261020
  MONITOR: |
    while true; do
      echo "[monitor $(date -u +%H:%M:%S)] $(free -m | awk '/Mem/{printf "memory %d/%d MB", $3, $2} /Swap/{printf ", swap %d MB", $3}'), $(df -h / | awk 'NR>1{printf "%s %s free  ", $6, $4}')"
      sleep 60
    done

jobs:
  text:
    name: Text encoder
    if: inputs.jobs == 'all' || inputs.jobs == 'text'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: |
          SWAP_FILE=/mnt/swapfile bash bm/tools/create/runner-setup.sh 24
          sudo mkdir -p /mnt/tmp /mnt/dist /mnt/hf && sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/dist /mnt/hf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install $TORCH_INSTALL
          pip install $PY_PACKAGES
      - name: ncnn block quantizer (ncnnllm2int)
        run: |
          git clone -q --depth 1 --branch "$NCNN_TAG" https://github.com/Tencent/ncnn ncnn-src
          cmake -S ncnn-src -B ncnn-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=OFF -DNCNN_BUILD_TOOLS=ON \
            -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_SIMPLEOCV=ON -DNCNN_PYTHON=OFF > /dev/null
          cmake --build ncnn-build --target ncnnllm2int -j "$(nproc)" > /dev/null
      - name: Convert and check the text encoder
        timeout-minutes: 120
        run: |
          set -o pipefail
          mkdir -p results
          bash -c "$MONITOR" &
          cd bm/tools/edit
          nice -n 10 /usr/bin/time -v -o ../../../results/time-text.txt python3 klein_export.py --stage text --repo "$REPO" \
            --out "$DIST" --check \
            --quantizer ../../../ncnn-build/tools/quantize/ncnnllm2int --bits "${{ inputs.bits }}" --block "${{ inputs.block }}" \
            2>&1 | grep --line-buffered -v -i "warn\|^quantize_\|^\s*$\|^ \|pnnx\|=\|#\|│\|─\|┌\|└\|├" | tee ../../../results/log-text.txt
          ls -la "$DIST"
          (cd "$DIST" && sha256sum *) > ../../../results/sha256-text.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text
          path: /mnt/dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-text
          path: results

  image:
    name: Transformer
    if: inputs.jobs == 'all' || inputs.jobs == 'image'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: |
          SWAP_FILE=/mnt/swapfile bash bm/tools/create/runner-setup.sh 32
          sudo mkdir -p /mnt/tmp /mnt/dist /mnt/hf && sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/dist /mnt/hf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install $TORCH_INSTALL
          pip install $PY_PACKAGES
      - name: ncnn block quantizer (ncnnllm2int)
        run: |
          git clone -q --depth 1 --branch "$NCNN_TAG" https://github.com/Tencent/ncnn ncnn-src
          cmake -S ncnn-src -B ncnn-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=OFF -DNCNN_BUILD_TOOLS=ON \
            -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_SIMPLEOCV=ON -DNCNN_PYTHON=OFF > /dev/null
          cmake --build ncnn-build --target ncnnllm2int -j "$(nproc)" > /dev/null
      - name: Convert and check the transformer
        timeout-minutes: 120
        run: |
          set -o pipefail
          mkdir -p results
          bash -c "$MONITOR" &
          cd bm/tools/edit
          python3 klein_export.py --stage vae --repo "$REPO" --out "$DIST" --check 2>&1 \
            | grep --line-buffered -v -i "warn\|^\s*$\|^ \|pnnx\|=\|#\|│\|─\|┌\|└\|├" | tee ../../../results/log-vae.txt
          nice -n 10 /usr/bin/time -v -o ../../../results/time-image.txt python3 klein_export.py --stage image --repo "$REPO" \
            --out "$DIST" --check \
            --quantizer ../../../ncnn-build/tools/quantize/ncnnllm2int --bits "${{ inputs.bits }}" --block "${{ inputs.block }}" \
            2>&1 | grep --line-buffered -v -i "warn\|^quantize_\|^\s*$\|^ \|pnnx\|=\|#\|│\|─\|┌\|└\|├" | tee ../../../results/log-image.txt
          ls -la "$DIST"
          (cd "$DIST" && sha256sum *) > ../../../results/sha256-image.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image
          path: /mnt/dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-image
          path: results

  check:
    name: Pictures against PyTorch
    needs: [text, image]
    # Runs after both, or alone on an earlier run's artifacts.
    if: always() && (inputs.jobs == 'check' || (needs.text.result == 'success' && needs.image.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write  # the pictures go to the edit-check release
      actions: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: |
          SWAP_FILE=/mnt/swapfile bash bm/tools/create/runner-setup.sh 32
          sudo mkdir -p /mnt/tmp /mnt/dist /mnt/hf /mnt/work && sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/dist /mnt/hf /mnt/work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install $TORCH_INSTALL
          pip install $PY_PACKAGES
      - name: The pieces
        uses: actions/download-artifact@v4
        with:
          pattern: "{text,image}"
          path: /mnt/dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Test pictures
        run: |
          ls -la /mnt/dist
          gh release download create-test -R "$GITHUB_REPOSITORY" -p "create-test-outputs.zip" -D zip
          mkdir -p inputs && unzip -q -j zip/create-test-outputs.zip "sana-1.6b/inputs/*" -d inputs && ls inputs
      - name: PyTorch reference
        timeout-minutes: 100
        run: |
          set -o pipefail
          mkdir -p results
          bash -c "$MONITOR" &
          nice -n 10 python3 bm/tools/edit/klein_check.py reference "$REPO" /mnt/work inputs 2>&1 \
            | grep --line-buffered -v -i "warn" | tee results/log-reference.txt
          sudo rm -rf /mnt/hf || true
      - name: The pieces on the same prompts and noise
        timeout-minutes: 180
        run: |
          set -o pipefail
          bash -c "$MONITOR" &
          nice -n 10 python3 bm/tools/edit/klein_check.py pieces /mnt/dist /mnt/work results 2>&1 \
            | grep --line-buffered -v -i "warn" | tee results/log-pieces.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check
          path: results
      - name: Publish the pictures (release edit-check)
        if: always()
        run: |
          cd results && ls -la
          gh release delete edit-check -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create edit-check -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Edit model check" --notes "Test pictures of the edit model's pieces against PyTorch (run $GITHUB_RUN_ID). Not a model release." ./*
