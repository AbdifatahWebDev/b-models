name: Create model (SANA-Sprint 0.6B)

# Builds Brekwol Upscale's Create model: SANA-Sprint 0.6B (NVIDIA; Gemma-2-2B text encoder)
# converted to ncnn pieces by tools/create/sana_export.py, in separate jobs so no runner holds
# more than one model (one runner holding the whole pipeline lost contact three times):
#   text   the Gemma vocabulary, int8 embedding rows and the text encoder in pieces of two layers
#          with the instruction prefix cached, block-quantized by ncnn's ncnnllm2int;
#   image  the transformer and the DC-AE decoder, split into its attention stages (whole) and its
#          convolution stages (run in tiles: whole, 1024 px needed over 13 GB), traced small and
#          checked in ncnn at 1024 px against PyTorch;
#   check  the pieces through tools/create/sana_ncnn.py (what the app does) against PyTorch, text
#          embeddings and a whole image, then three sample pictures, and release create-model.
# Every job prints memory and disk use each minute. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      bits:
        description: Text encoder weight bits
        type: choice
        options: ["8", "6", "4"]
        default: "8"
      block:
        description: Quantization block size
        type: choice
        options: ["64", "32", "128"]
        default: "64"
      quantize_dit:
        description: Quantize the transformer too (smaller download)
        type: boolean
        default: false

permissions:
  contents: write

env:
  NCNN_TAG: "20261020"
  REPO: Efficient-Large-Model/Sana_Sprint_0.6B_1024px_diffusers
  GEMMA_TOKENIZER: https://raw.githubusercontent.com/google/gemma_pytorch/main/tokenizer/tokenizer.model
  GEMMA_TOKENIZER_SHA256: 61a7b147390c64585d6c3543dd6fc636906c9af3865a5548f27f31aee1d4c8e2
  HF_HOME: /mnt/hf
  TMPDIR: /mnt/tmp
  DIST: /mnt/dist
  PYTHONUNBUFFERED: "1"
  # Leave a core for the runner itself.
  OMP_NUM_THREADS: "3"
  TORCH_INSTALL: torch==2.15.0 torchvision --index-url https://download.pytorch.org/whl/cpu
  PY_PACKAGES: diffusers==0.42.1 transformers==5.22.2 accelerate==1.15.0 safetensors sentencepiece protobuf pillow numpy ncnn==1.0.20261020 pnnx==20261020
  MONITOR: |
    while true; do
      echo "[monitor $(date -u +%H:%M:%S)] $(free -m | awk '/Mem/{printf "memory %d/%d MB", $3, $2} /Swap/{printf ", swap %d MB", $3}'), $(df -h / /mnt | awk 'NR>1{printf "%s %s free  ", $6, $4}')"
      sleep 60
    done

jobs:
  text:
    name: Text encoder
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: |
          SWAP_FILE=/mnt/swapfile bash bm/tools/create/runner-setup.sh 16
          sudo mkdir -p /mnt/tmp /mnt/dist && sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install $TORCH_INSTALL
          pip install $PY_PACKAGES
      - name: ncnn block quantizer (ncnnllm2int)
        run: |
          git clone -q --depth 1 --branch "$NCNN_TAG" https://github.com/Tencent/ncnn ncnn-src
          cmake -S ncnn-src -B ncnn-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=OFF -DNCNN_BUILD_TOOLS=ON \
            -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_SIMPLEOCV=ON -DNCNN_PYTHON=OFF > /dev/null
          cmake --build ncnn-build --target ncnnllm2int -j "$(nproc)" > /dev/null
      - name: Gemma tokenizer
        run: |
          curl -fL --retry 3 -o tokenizer.model "$GEMMA_TOKENIZER"
          echo "$GEMMA_TOKENIZER_SHA256  tokenizer.model" | sha256sum -c
      - name: Convert the text encoder
        timeout-minutes: 110
        run: |
          set -o pipefail
          mkdir -p results
          bash -c "$MONITOR" &
          cd bm/tools/create
          nice -n 10 /usr/bin/time -v -o ../../../results/time-text.txt python3 sana_export.py --stage text --repo "$REPO" \
            --vocab-model ../../../tokenizer.model --out "$DIST" \
            --quantizer ../../../ncnn-build/tools/quantize/ncnnllm2int --bits "${{ inputs.bits }}" --block "${{ inputs.block }}" \
            2>&1 | grep --line-buffered -v -i "warn\|^quantize_\|^\s*$\|^ \|pnnx\|=\|#\|│\|─\|┌\|└\|├" | tee ../../../results/log-text.txt
          ls -la "$DIST"
      - uses: actions/upload-artifact@v4
        with:
          name: text
          path: /mnt/dist
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-text
          path: results

  image:
    name: Transformer and decoder
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: |
          SWAP_FILE=/mnt/swapfile bash bm/tools/create/runner-setup.sh 48
          sudo mkdir -p /mnt/tmp /mnt/dist && sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install $TORCH_INSTALL
          pip install $PY_PACKAGES
      - name: ncnn block quantizer (only for a quantized transformer)
        if: inputs.quantize_dit
        run: |
          git clone -q --depth 1 --branch "$NCNN_TAG" https://github.com/Tencent/ncnn ncnn-src
          cmake -S ncnn-src -B ncnn-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNCNN_VULKAN=OFF -DNCNN_BUILD_TOOLS=ON \
            -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_SIMPLEOCV=ON -DNCNN_PYTHON=OFF > /dev/null
          cmake --build ncnn-build --target ncnnllm2int -j "$(nproc)" > /dev/null
      - name: Gemma tokenizer
        run: |
          curl -fL --retry 3 -o tokenizer.model "$GEMMA_TOKENIZER"
          echo "$GEMMA_TOKENIZER_SHA256  tokenizer.model" | sha256sum -c
      - name: Convert the transformer and decoder
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p results
          bash -c "$MONITOR" &
          Q=""
          [ "${{ inputs.quantize_dit }}" = "true" ] && Q="--quantize-dit --quantizer ../../../ncnn-build/tools/quantize/ncnnllm2int --bits ${{ inputs.bits }} --block ${{ inputs.block }}"
          cd bm/tools/create
          nice -n 10 /usr/bin/time -v -o ../../../results/time-image.txt python3 sana_export.py --stage image --repo "$REPO" \
            --vocab-model ../../../tokenizer.model --out "$DIST" $Q \
            2>&1 | grep --line-buffered -v -i "warn\|^quantize_\|^\s*$\|^ \|pnnx\|=\|#\|│\|─\|┌\|└\|├" | tee ../../../results/log-image.txt
          ls -la "$DIST"
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /mnt/dist
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-image
          path: results

  check:
    name: Check, samples and release
    needs: [text, image]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bm
      - name: Disk and swap
        run: |
          SWAP_FILE=/mnt/swapfile bash bm/tools/create/runner-setup.sh 48
          sudo mkdir -p /mnt/tmp /mnt/dist && sudo chown "$(id -u):$(id -g)" /mnt/tmp /mnt/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install $TORCH_INSTALL
          pip install $PY_PACKAGES
      - name: Gemma tokenizer
        run: |
          curl -fL --retry 3 -o tokenizer.model "$GEMMA_TOKENIZER"
          echo "$GEMMA_TOKENIZER_SHA256  tokenizer.model" | sha256sum -c
      - name: The pieces
        uses: actions/download-artifact@v4
        with:
          pattern: "{text,image}"
          path: /mnt/dist
          merge-multiple: true
      - name: create.json
        run: |
          cd bm/tools/create
          python3 -c "import sana_export, sys; sana_export.merge_meta(sys.argv[1])" "$DIST"
          ls -la "$DIST"
      - name: Check against PyTorch
        timeout-minutes: 90
        run: |
          set -o pipefail
          mkdir -p results
          bash -c "$MONITOR" &
          cd bm/tools/create
          nice -n 10 /usr/bin/time -v -o ../../../results/time-check.txt python3 sana_ncnn.py --check "$DIST" "$REPO" ../../../tokenizer.model \
            2>&1 | grep --line-buffered -v -i "warn" | tee ../../../results/log-check.txt
      - name: Sample pictures from the pieces
        if: always()
        run: |
          mkdir -p results
          cd bm/tools/create
          for p in "fox|A red fox sitting in fresh snow in a forest, sharp focus on the eyes" \
                   "cafe|A cozy coffee shop interior with a chalkboard menu, warm lights, plants" \
                   "portrait|Portrait of a young African woman with braided hair smiling, natural window light"; do
            /usr/bin/time -f "${p%%|*}: %e s, %M KB" python3 sana_ncnn.py "$DIST" "${p#*|}" "../../../results/sample-${p%%|*}.png" \
              --vocab ../../../tokenizer.model 2>&1 | tail -1 | tee -a ../../../results/log-samples.txt
          done
          cp "$DIST/check-create.png" ../../../results/ 2>/dev/null || true
          rm -f "$DIST/check-create.png"
      - name: Publish
        if: success()
        run: |
          (cd "$DIST" && sha256sum *) | tee results/sha256.txt
          ls -la "$DIST" results
          # A new run replaces the last release (its files change between versions).
          gh release delete create-model -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create create-model -R "$GITHUB_REPOSITORY" "$DIST"/* results/* --title "Create model (SANA-Sprint 0.6B)" \
            --notes "SANA-Sprint 0.6B (NVIDIA, Apache-2.0) with its Gemma-2-2B text encoder (Gemma terms of use), converted to ncnn pieces for Brekwol Upscale's Create screen by tools/create/sana_export.py. Text encoder in ${{ inputs.bits }}-bit blocks of ${{ inputs.block }}. check-create.png: PyTorch (left) and the pieces (right) from the same noise; log-check.txt has the numbers."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-check
          path: results
